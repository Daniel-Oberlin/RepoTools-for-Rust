[workspace]
resolver = "2"
members = ["manifest", "sync", "rt", "rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Daniel Oberlin"]
repository = "https://github.com/Daniel-Oberlin/RepoTools-for-Rust"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
sha2 = "0.10"
digest = "0.10"
base64 = "0.22"
regex = "1"
walkdir = "2"
unicode-normalization = "0.1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"

# dev
tempfile = "3"
assert_cmd = "2"
predicates = "3"
